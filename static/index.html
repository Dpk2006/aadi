<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT Device Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #667eea;
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .subtitle {
            color: #666;
            font-size: 1.1rem;
        }

        .config-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        input,
        select {
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: white;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            padding: 14px 32px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .status-bar {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px 30px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .status-dot.active {
            background: #10b981;
        }

        .status-dot.inactive {
            background: #ef4444;
            animation: none;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card-title {
            font-size: 0.9rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .card-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 5px;
        }

        .card-unit {
            font-size: 0.9rem;
            color: #999;
        }

        .chart-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .data-table {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }

        th {
            background: #f8f9fa;
            font-weight: 600;
            color: #333;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }

        tr:hover {
            background: #f8f9fa;
        }

        .alert {
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .alert-error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
        }

        .alert-info {
            background: #dbeafe;
            color: #1e40af;
            border: 1px solid #93c5fd;
        }

        .hidden {
            display: none;
        }

        .share-link {
            background: #f0f0f0;
            padding: 12px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.9rem;
            word-break: break-all;
            margin-top: 10px;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8rem;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>🌐 IoT Device Dashboard</h1>
            <p class="subtitle">Real-time sensor data monitoring</p>
        </div>

        <div class="config-panel">
            <h2 style="margin-bottom: 20px; color: #333;">Device Configuration</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label for="deviceId">Device ID</label>
                    <input type="text" id="deviceId">
                </div>
                <div class="form-group">
                    <label for="deviceName">Device Name</label>
                    <input type="text" id="deviceName">
                </div>
                <div class="form-group">
                    <label for="category">Category</label>
                    <input type="text" id="category">
                </div>
                <div class="form-group">
                    <label for="apiKey">API Key</label>
                    <input type="password" id="apiKey">
                </div>
            </div>
            <div class="button-group">
                <button class="btn btn-primary" onclick="startMonitoring()">Start Monitoring</button>
                <button class="btn btn-secondary" onclick="stopMonitoring()">Stop</button>
                <button class="btn btn-secondary" onclick="downloadJSON()">📥 Download JSON</button>
                <button class="btn btn-secondary" onclick="downloadCSV()">📥 Download CSV</button>
                <button class="btn btn-secondary" onclick="generateShareLink()">Generate Share Link</button>
            </div>
            <div id="shareLink" class="hidden">
                <p style="margin-top: 15px; font-weight: 600;">Shareable Link:</p>
                <div class="share-link" id="shareLinkText"></div>
            </div>
        </div>

        <div id="errorAlert" class="alert alert-error hidden"></div>

        <div id="dashboard" class="hidden">
            <div class="status-bar">
                <div class="status-indicator">
                    <div class="status-dot active"></div>
                    <span style="font-weight: 600;">Live Monitoring Active</span>
                </div>
                <div style="color: #666;">
                    Last Update: <span id="lastUpdate">-</span>
                </div>
            </div>

            <div class="dashboard-grid" id="metricsGrid"></div>

            <div class="chart-container">
                <h3 style="margin-bottom: 20px; color: #333;">Historical Data</h3>
                <canvas id="dataChart"></canvas>
            </div>

            <div class="data-table">
                <h3 style="margin-bottom: 20px; color: #333;">Recent Readings</h3>
                <table id="dataTable">
                    <thead>
                        <tr>
                            <th>Timestamp</th>
                            <th>Data</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let refreshInterval = null;
        let chart = null;
        let historicalData = [];

        // Load config from URL parameters
        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            if (params.get('device_id')) document.getElementById('deviceId').value = params.get('device_id');
            if (params.get('device_name')) document.getElementById('deviceName').value = params.get('device_name');
            if (params.get('category')) document.getElementById('category').value = params.get('category');
            if (params.get('api_key')) document.getElementById('apiKey').value = params.get('api_key');

            // Auto-start if all params present
            if (params.get('device_id') && params.get('api_key')) {
                startMonitoring();
            }
        });

        // Get API URL from current origin
        function getApiUrl() {
            return window.location.origin;
        }

        function showError(message) {
            const errorAlert = document.getElementById('errorAlert');
            errorAlert.textContent = message;
            errorAlert.classList.remove('hidden');
            setTimeout(() => errorAlert.classList.add('hidden'), 5000);
        }

        function generateShareLink() {
            const deviceId = document.getElementById('deviceId').value;
            const deviceName = document.getElementById('deviceName').value;
            const category = document.getElementById('category').value;
            const apiKey = document.getElementById('apiKey').value;

            const params = new URLSearchParams({
                device_id: deviceId,
                device_name: deviceName,
                category: category,
                api_key: apiKey
            });

            const shareUrl = `${window.location.origin}${window.location.pathname}?${params.toString()}`;
            document.getElementById('shareLinkText').textContent = shareUrl;
            document.getElementById('shareLink').classList.remove('hidden');
        }

        async function fetchLatestData() {
            const apiUrl = getApiUrl();
            const category = document.getElementById('category').value;
            const deviceName = document.getElementById('deviceName').value;
            const apiKey = document.getElementById('apiKey').value;

            try {
                const response = await fetch(
                    `${apiUrl}/api/v1/logs/${category}/${deviceName}?mode=latest`,
                    {
                        headers: {
                            'X-API-Key': apiKey
                        }
                    }
                );

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                updateDashboard(data);
                return data;
            } catch (error) {
                showError(`Failed to fetch data: ${error.message}`);
                throw error;
            }
        }

        async function fetchHistoricalData() {
            const apiUrl = getApiUrl();
            const category = document.getElementById('category').value;
            const deviceName = document.getElementById('deviceName').value;
            const apiKey = document.getElementById('apiKey').value;

            try {
                const response = await fetch(
                    `${apiUrl}/api/v1/logs/${category}/${deviceName}?mode=json&limit=20`,
                    {
                        headers: {
                            'X-API-Key': apiKey
                        }
                    }
                );

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const data = await response.json();
                historicalData = data.reverse(); // Oldest first for chart
                updateChart();
                updateTable(data.reverse()); // Newest first for table
            } catch (error) {
                console.error('Failed to fetch historical data:', error);
            }
        }

        function updateDashboard(data) {
            document.getElementById('dashboard').classList.remove('hidden');
            document.getElementById('lastUpdate').textContent = new Date(data.timestamp).toLocaleString();

            // Update metrics cards
            const metricsGrid = document.getElementById('metricsGrid');
            metricsGrid.innerHTML = '';

            for (const [key, value] of Object.entries(data.payload)) {
                const card = document.createElement('div');
                card.className = 'card';

                let displayValue = value;
                let unit = '';

                if (key === 'temperature') unit = '°C';
                else if (key === 'humidity') unit = '%';
                else if (key === 'pressure') unit = 'hPa';
                else if (key === 'battery_voltage') unit = 'V';
                else if (key === 'rssi') unit = 'dBm';

                if (typeof value === 'number') {
                    displayValue = value.toFixed(2);
                }

                card.innerHTML = `
                    <div class="card-title">${key.replace(/_/g, ' ')}</div>
                    <div class="card-value">${displayValue}</div>
                    <div class="card-unit">${unit}</div>
                `;
                metricsGrid.appendChild(card);
            }
        }

        function updateChart() {
            const ctx = document.getElementById('dataChart').getContext('2d');

            if (chart) {
                chart.destroy();
            }

            // Extract numeric fields for charting
            const numericFields = {};
            if (historicalData.length > 0) {
                for (const [key, value] of Object.entries(historicalData[0].payload)) {
                    if (typeof value === 'number') {
                        numericFields[key] = [];
                    }
                }
            }

            const labels = historicalData.map(d => new Date(d.timestamp).toLocaleTimeString());

            historicalData.forEach(entry => {
                for (const key in numericFields) {
                    numericFields[key].push(entry.payload[key]);
                }
            });

            const datasets = Object.entries(numericFields).map(([key, values], index) => {
                const colors = [
                    '#667eea', '#764ba2', '#f093fb', '#4facfe',
                    '#43e97b', '#fa709a', '#fee140', '#30cfd0'
                ];
                return {
                    label: key.replace(/_/g, ' '),
                    data: values,
                    borderColor: colors[index % colors.length],
                    backgroundColor: colors[index % colors.length] + '20',
                    tension: 0.4,
                    fill: true
                };
            });

            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: datasets
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: {
                            position: 'top',
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: false
                        }
                    }
                }
            });
        }

        function updateTable(data) {
            const tbody = document.querySelector('#dataTable tbody');
            tbody.innerHTML = '';

            data.slice(0, 10).forEach(entry => {
                const row = tbody.insertRow();
                row.insertCell(0).textContent = new Date(entry.timestamp).toLocaleString();
                row.insertCell(1).textContent = JSON.stringify(entry.payload, null, 2);
            });
        }

        async function startMonitoring() {
            const deviceId = document.getElementById('deviceId').value;
            const apiKey = document.getElementById('apiKey').value;
            const category = document.getElementById('category').value;
            const deviceName = document.getElementById('deviceName').value;

            if (!deviceId || !apiKey || !category || !deviceName) {
                showError('Please fill in Device ID, Device Name, Category, and API Key');
                return;
            }

            try {
                await fetchLatestData();
                await fetchHistoricalData();

                // Refresh every 5 seconds
                if (refreshInterval) clearInterval(refreshInterval);
                refreshInterval = setInterval(async () => {
                    await fetchLatestData();
                    await fetchHistoricalData();
                }, 5000);
            } catch (error) {
                console.error('Failed to start monitoring:', error);
            }
        }

        async function downloadJSON() {
            const apiUrl = getApiUrl();
            const category = document.getElementById('category').value;
            const deviceName = document.getElementById('deviceName').value;
            const apiKey = document.getElementById('apiKey').value;
            const deviceId = document.getElementById('deviceId').value;

            if (!deviceId || !apiKey) {
                showError('Please fill in credentials');
                return;
            }

            try {
                const response = await fetch(
                    `${apiUrl}/api/v1/logs/${category}/${deviceName}?mode=json&limit=1000`,
                    {
                        headers: {
                            'X-API-Key': apiKey
                        }
                    }
                );

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${deviceName}_logs_${new Date().toISOString().split('T')[0]}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            } catch (error) {
                showError(`Failed to download JSON: ${error.message}`);
            }
        }

        async function downloadCSV() {
            const apiUrl = getApiUrl();
            const category = document.getElementById('category').value;
            const deviceName = document.getElementById('deviceName').value;
            const apiKey = document.getElementById('apiKey').value;
            const deviceId = document.getElementById('deviceId').value;

            if (!deviceId || !apiKey) {
                showError('Please fill in credentials');
                return;
            }

            try {
                const response = await fetch(
                    `${apiUrl}/api/v1/logs/${category}/${deviceName}?mode=csv&limit=1000`,
                    {
                        headers: {
                            'X-API-Key': apiKey
                        }
                    }
                );

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const csvData = await response.text();
                const blob = new Blob([csvData], { type: 'text/csv' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${deviceName}_logs_${new Date().toISOString().split('T')[0]}.csv`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            } catch (error) {
                showError(`Failed to download CSV: ${error.message}`);
            }
        }

        function stopMonitoring() {
            if (refreshInterval) {
                clearInterval(refreshInterval);
                refreshInterval = null;
            }
            document.querySelector('.status-dot').classList.remove('active');
            document.querySelector('.status-dot').classList.add('inactive');
        }
    </script>
</body>

</html>
